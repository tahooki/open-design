
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toss 홈 · 자산 요약</title>
  <style>
    :root {
      --bg: #f9fafb;
      --surface: #ffffff;
      --fg: #191f28;
      --muted: #6b7684;
      --border: #e5e8eb;
      --accent: #3182f6;
      --blue-soft: #e8f3ff;
      --grey-100: #f2f4f6;
      --grey-400: #b0b8c1;
      --grey-500: #8b95a1;
      --grey-700: #4e5968;
      --success: #03b26c;
      --danger: #f04452;
      --warning: #fe9800;
      --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --font-display: "Toss Product Sans", "Tossface", "SF Pro KR", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Basier Square", "Apple SD Gothic Neo", Roboto, "Noto Sans KR", sans-serif;
      --font-body: "Toss Product Sans", "Tossface", "SF Pro KR", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Basier Square", "Apple SD Gothic Neo", Roboto, "Noto Sans KR", sans-serif;
      --font-mono: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --fs-h1: 26px;
      --fs-h2: 20px;
      --fs-h3: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;
      --radius-card: 16px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #f2f4f6;
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 0 2px #000 inset, 0 28px 60px -12px rgba(0,0,0,0.45), 0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after { right: -1px; }

    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1 { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2 { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3 { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: 0;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    .pad { padding-inline: 20px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .header {
      padding: 8px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      letter-spacing: 0;
      line-height: 1.1;
      margin: 0;
    }
    .greeting {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .card {
      background: var(--surface);
      border: 0;
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(var(--tabs, 4), 1fr);
      padding: 8px 8px 0;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(20px);
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0;
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .tab.active svg { stroke-width: 2; }

    .btn-primary, .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; border: 0; }
    .btn-secondary { background: rgba(2, 32, 71, 0.05); color: var(--grey-700); border: 0; }

    .top-actions { display: flex; align-items: center; gap: 6px; }
    .ghost-icon {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--grey-700);
      display: grid;
      place-items: center;
    }
    .ghost-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    .asset-hero { padding: 22px 20px 20px; margin-bottom: 12px; }
    .asset-label { margin: 0 0 8px; color: var(--grey-500); font-size: 14px; line-height: 1.4; }
    .asset-total {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }
    .asset-delta {
      margin: 8px 0 18px;
      color: var(--success);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quick-actions .btn-primary, .quick-actions .btn-secondary { min-height: 46px; }

    .section-title {
      margin: 22px 0 8px;
      padding-inline: 20px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--fg);
    }
    .account-card { margin-inline: 20px; padding: 4px 16px; }
    .money-row {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .money-row:first-child { border-top: 0; }
    .bank-mark {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      background: #4e5968;
    }
    .bank-mark.green { background: #8b95a1; }
    .name { font-size: 15px; font-weight: 600; color: var(--fg); line-height: 1.25; }
    .detail { margin-top: 3px; color: var(--grey-500); font-size: 13px; line-height: 1.3; }
    .amount {
      text-align: right;
      font-size: 15px;
      font-weight: 700;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ticker-card { margin-inline: 20px; padding: 16px; }
    .ticker-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .weak-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 7px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: #16a34a;
      font-size: 12px;
      font-weight: 700;
    }
    .mini-chart {
      height: 58px;
      margin-top: 14px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(3,178,108,0.13), rgba(3,178,108,0)), linear-gradient(90deg, transparent 0 19%, rgba(229,232,235,0.9) 20% 20.5%, transparent 21% 39%, rgba(229,232,235,0.9) 40% 40.5%, transparent 41% 59%, rgba(229,232,235,0.9) 60% 60.5%, transparent 61% 79%, rgba(229,232,235,0.9) 80% 80.5%, transparent 81%);
      position: relative;
      overflow: hidden;
    }
    .mini-chart::after {
      content: "";
      position: absolute;
      inset: 12px 8px 10px;
      background: none;
      border-bottom: 3px solid var(--success);
      clip-path: polygon(0 78%, 18% 68%, 36% 72%, 54% 42%, 72% 52%, 100% 18%, 100% 26%, 72% 60%, 54% 50%, 36% 80%, 18% 76%, 0 86%);
    }

    .spend-card {
      margin-inline: 20px;
      padding: 16px;
      background: var(--grey-100);
      box-shadow: none;
    }
    .spend-bar {
      height: 8px;
      margin-top: 12px;
      border-radius: 999px;
      background: #d1d6db;
      overflow: hidden;
    }
    .spend-bar span {
      display: block;
      height: 100%;
      width: 68%;
      border-radius: inherit;
      background: var(--grey-700);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Toss</strong> · 홈 / 자산 요약</div>
    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden></span>
      <span class="btn-rail left-2" aria-hidden></span>
      <span class="btn-rail left-3" aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island" aria-hidden></span>

      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden>
              <rect x="0" y="7" width="3" height="4" rx="0.6"/>
              <rect x="4" y="5" width="3" height="6" rx="0.6"/>
              <rect x="8" y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden>
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden>
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4"/>
            </svg>
          </span>
        </div>

        <main class="content" data-od-id="content">
          <div class="header" data-od-id="header">
            <div>
              <p class="greeting">5월 14일 목요일</p>
              <h1>내 자산</h1>
            </div>
            <div class="top-actions" aria-label="홈 액션">
              <button class="ghost-icon" aria-label="알림">
                <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
              </button>
              <button class="ghost-icon" aria-label="설정">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
              </button>
            </div>
          </div>

          <section class="pad" data-od-id="asset-summary">
            <div class="card asset-hero">
              <p class="asset-label">총 자산</p>
              <h2 class="asset-total num">28,476,920원</h2>
              <p class="asset-delta num">지난달보다 284,500원 늘었어요</p>
              <div class="quick-actions">
                <button class="btn-primary">송금하기</button>
                <button class="btn-secondary">계좌 추가</button>
              </div>
            </div>
          </section>

          <h2 class="section-title">자주 쓰는 계좌</h2>
          <section class="card account-card" data-od-id="accounts">
            <div class="money-row">
              <div class="bank-mark">T</div>
              <div>
                <div class="name">토스뱅크 통장</div>
                <div class="detail">입출금 · 1002</div>
              </div>
              <div class="amount num">8,240,000원</div>
            </div>
            <div class="money-row">
              <div class="bank-mark">KB</div>
              <div>
                <div class="name">KB국민 주거래</div>
                <div class="detail">월급 · 4821</div>
              </div>
              <div class="amount num">3,120,500원</div>
            </div>
            <div class="money-row">
              <div class="bank-mark green">NH</div>
              <div>
                <div class="name">NH 생활비</div>
                <div class="detail">체크카드 연결</div>
              </div>
              <div class="amount num">946,420원</div>
            </div>
          </section>

          <h2 class="section-title">투자</h2>
          <section class="card ticker-card" data-od-id="investments">
            <div class="ticker-top">
              <div>
                <div class="name">토스증권 계좌</div>
                <div class="detail">국내주식 · 해외주식</div>
              </div>
              <div style="text-align: right;">
                <div class="amount num">12,860,000원</div>
                <span class="weak-badge num">+2.8%</span>
              </div>
            </div>
            <div class="mini-chart" aria-label="투자 수익률 미니 차트"></div>
          </section>

          <h2 class="section-title">이번 달 소비</h2>
          <section class="card spend-card" data-od-id="monthly-spend">
            <div class="row-between">
              <div>
                <div class="name">5월 지출</div>
                <div class="detail">예산 1,200,000원 중</div>
              </div>
              <div class="amount num">816,400원</div>
            </div>
            <div class="spend-bar" aria-hidden="true"><span></span></div>
          </section>
        </main>

        <nav class="tabbar" style="--tabs: 4;" data-od-id="tabbar">
          <a class="tab active">
            <svg viewBox="0 0 24 24"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
            홈
          </a>
          <a class="tab">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            혜택
          </a>
          <a class="tab">
            <svg viewBox="0 0 24 24"><path d="M22 12c0 5.5-4.5 10-10 10S2 17.5 2 12 6.5 2 12 2s10 4.5 10 10z"/><path d="M12 6v6l4 2"/></svg>
            송금
          </a>
          <a class="tab">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
            전체
          </a>
        </nav>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
